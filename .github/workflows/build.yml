# Builds all nine Epsilon plugins on a Mac on every push, checks them with pluginval,
# and offers the finished VST3 / AU / Standalone as downloads (Actions tab > latest run > Artifacts).
name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dsp-tests:
    # Engine checks with clang and fused multiply-add (the same maths Apple Silicon uses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP suite at 44.1 / 48 / 96 kHz and automation fuzz
        run: |
          clang++ -O3 -std=c++17 -march=haswell -ISource Tests/suite.cpp -o suite
          ./suite 48000 && ./suite 44100 && ./suite 96000
          clang++ -O3 -std=c++17 -march=haswell -ISource Tests/fuzz.cpp -o fuzz && ./fuzz

  mac:
    needs: dsp-tests
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        effect: [Heat, Valve, Crush, Prism, Time, Plate, Space, Tone, Voice]
    steps:
      - uses: actions/checkout@v4

      - name: Build Epsilon ${{ matrix.effect }} (Projucer Xcode project, Release, Universal)
        run: |
          xcodebuild -project "Epsilon${{ matrix.effect }}/Builds/MacOSX/Epsilon ${{ matrix.effect }}.xcodeproj" \
                     -target "Epsilon ${{ matrix.effect }} - All" -configuration Release \
                     ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" -quiet build

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests \
            --validate "Epsilon${{ matrix.effect }}/Builds/MacOSX/build/Release/Epsilon ${{ matrix.effect }}.vst3"

      - name: Package
        run: |
          N="Epsilon ${{ matrix.effect }}"
          B="Epsilon${{ matrix.effect }}/Builds/MacOSX/build/Release"
          mkdir -p dist
          cp -R "$B/$N.vst3" "$B/$N.component" "$B/$N.app" dist/
          for f in dist/*.vst3/Contents/MacOS/* dist/*.component/Contents/MacOS/*; do lipo -archs "$f"; done || true
          cat > dist/INSTALL.txt <<TXT
          1. Copy "$N.vst3" to ~/Library/Audio/Plug-Ins/VST3/
          2. Copy "$N.component" to ~/Library/Audio/Plug-Ins/Components/
          3. These builds are not signed with an Apple developer certificate, so run once in Terminal:
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"$N.vst3" ~/Library/Audio/Plug-Ins/Components/"$N.component"
          4. Rescan plugins in your DAW.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: Epsilon${{ matrix.effect }}-macOS
          path: dist
          retention-days: 30

  pack:
    # One download with all nine: VST3 + AU folders and a double-click installer
    needs: mac
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Epsilon*-macOS
          path: parts
      - name: Assemble the Expansion pack
        run: |
          P="Epsilon Expansion"
          mkdir -p "$P/VST3" "$P/Components" "$P/Standalone"
          for d in parts/*; do
            cp -R "$d"/*.vst3 "$P/VST3/"
            cp -R "$d"/*.component "$P/Components/"
            cp -R "$d"/*.app "$P/Standalone/" 2>/dev/null || true
          done
          cat > "$P/Install Expansion.command" <<'SH'
          #!/bin/bash
          # Installs all nine Epsilon Expansion plugins (VST3 + AU) and clears the download quarantine.
          cd "$(dirname "$0")" || exit 1
          V="$HOME/Library/Audio/Plug-Ins/VST3"; A="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$V" "$A"
          for p in VST3/*.vst3; do rm -rf "$V/$(basename "$p")"; cp -R "$p" "$V/"; xattr -dr com.apple.quarantine "$V/$(basename "$p")"; echo "VST3  $(basename "$p")"; done
          for p in Components/*.component; do rm -rf "$A/$(basename "$p")"; cp -R "$p" "$A/"; xattr -dr com.apple.quarantine "$A/$(basename "$p")"; echo "AU    $(basename "$p")"; done
          killall -9 AudioComponentRegistrar >/dev/null 2>&1
          echo; echo "Installed. In FL Studio: Options > Manage plugins > Find more plugins."
          read -r -p "Press Return to close." _
          SH
          sed -i '' 's/^          //' "$P/Install Expansion.command"
          chmod +x "$P/Install Expansion.command"
          cat > "$P/READ ME FIRST.txt" <<'TXT'
          Epsilon Expansion - all nine plugins, Intel + Apple Silicon.
          Right-click "Install Expansion.command" > Open (the first time macOS asks because it isn't signed).
          It copies every VST3 and AU into ~/Library/Audio/Plug-Ins and clears the quarantine. Then rescan in your DAW.
          TXT
          ls -R "$P" | head -40
          ditto -c -k --keepParent "$P" "Epsilon-Expansion-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Epsilon-Expansion-ALL-macOS
          path: Epsilon-Expansion-macOS.zip
          retention-days: 30
